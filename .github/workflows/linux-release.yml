name: Publish Linux release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: linux-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected a version tag such as v0.1.0-alpha.1" >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Linux release assets
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          export OVERLAY_DIR
          OVERLAY_DIR=$(mktemp -d)
          trap 'rm -rf "$OVERLAY_DIR"' EXIT
          printf 'package main\n\nconst Version = "%s"\n' "${RELEASE_TAG#v}" > "$OVERLAY_DIR/version.go"
          python3 - <<'PY' > "$OVERLAY_DIR/overlay.json"
          import json
          import os
          from pathlib import Path

          replacement = Path(os.environ["OVERLAY_DIR"]) / "version.go"
          print(json.dumps({"Replace": {str(Path.cwd() / "version.go"): str(replacement)}}))
          PY

          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -mod=readonly -trimpath -overlay="$OVERLAY_DIR/overlay.json" \
              -o "dist/hushivowg-go-${RELEASE_TAG}-linux-${arch}" .
          done

          cd dist
          "./hushivowg-go-${RELEASE_TAG}-linux-amd64" --version | grep -F "wireguard-go ${RELEASE_TAG}"
          sha256sum "hushivowg-go-${RELEASE_TAG}-linux-amd64" \
            "hushivowg-go-${RELEASE_TAG}-linux-arm64" > SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            --notes "Linux amd64 and arm64 binaries built from the $RELEASE_TAG tag. Verify downloads with SHA256SUMS."
